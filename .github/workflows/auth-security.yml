name: Oturum güvenliği
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: codex_sportoto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d codex_sportoto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: kurgusal-ci-sportoto-anahtari-yalniz-test-icin
      DATABASE_URL: postgresql://fixture:fixture-only-password@127.0.0.1:5432/codex_sportoto_test
      SPORTOTO_TEST_DATABASE_URL: postgresql://fixture:fixture-only-password@127.0.0.1:5432/codex_sportoto_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:auth
      - run: npx tsc --noEmit
      - run: npm run build
